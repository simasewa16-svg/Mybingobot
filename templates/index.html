<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ዘና ቢንጎ ከድጎ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  body {
    background:linear-gradient(180deg,#f5e6f7 0%,#ede0f0 100%);
    color:#333; min-height:100vh; padding:10px; padding-bottom:80px;
  }
  .header {
    background:linear-gradient(135deg,#8e44ad,#6c3483);
    color:#fff; padding:12px; border-radius:14px;
    text-align:center; margin-bottom:8px;
    box-shadow:0 4px 15px rgba(142,68,173,0.4);
  }
  .header h1 { font-size:18px; letter-spacing:0.5px; }
  .header p { font-size:12px; opacity:0.9; margin-top:3px; }
  .stats-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-bottom:8px; }
  .stat-box { background:#fff; border-radius:10px; padding:6px 3px; text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.08); border:1px solid #e0c4e8; }
  .stat-box .label { font-size:9px; color:#888; }
  .stat-box .value { font-size:15px; font-weight:bold; color:#c0392b; margin-top:2px; }
  .stat-box.live .value { color:#27ae60; }
  .timer-banner {
    background:linear-gradient(135deg,#e74c3c,#c0392b);
    color:#fff; padding:10px; border-radius:12px;
    text-align:center; margin-bottom:8px;
    font-weight:bold; font-size:14px;
    animation:pulse 1s infinite;
  }
  .timer-banner.safe {
    background:linear-gradient(135deg,#27ae60,#1e8449);
    animation:none;
  }
  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:0.7; }
  }
  .top-row {
    display:grid; grid-template-columns:80px 1fr; gap:8px;
    margin-bottom:8px;
  }
  .called-box {
    background:linear-gradient(135deg,#f39c12,#e67e22);
    color:#fff; border-radius:14px; padding:10px 5px;
    text-align:center; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(243,156,18,0.4);
    min-height:100px;
  }
  .called-box .label { font-size:9px; opacity:0.9; margin-bottom:4px; }
  .called-box .value { font-size:36px; font-weight:bold; line-height:1; }
  .mycard-box {
    background:#fff; border-radius:14px; padding:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
    border:1px solid #e0c4e8;
  }
  .mycard-box .title {
    font-size:11px; font-weight:bold; color:#8e44ad;
    text-align:center; margin-bottom:5px;
  }
  .bingo-header {
    display:grid; grid-template-columns:repeat(5,1fr); gap:3px;
    margin-bottom:3px;
  }
  .bingo-header div {
    text-align:center; font-weight:bold; font-size:12px;
    padding:3px 0; border-radius:6px; color:#fff;
  }
  .b-red { background:#e74c3c; }
  .b-green { background:#27ae60; }
  .b-yellow { background:#f39c12; }
  .b-blue { background:#3498db; }
  .b-purple { background:#9b59b6; }
  .mini-card-grid {
    display:grid; grid-template-columns:repeat(5,1fr); gap:3px;
  }
  .mini-card-cell {
    aspect-ratio:1; background:#f9f4fc; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:bold; color:#555;
    border:1px solid #e0c4e8;
  }
  .mini-card-cell.called {
    background:#27ae60; color:#fff; border-color:#1e8449;
    box-shadow:0 2px 6px rgba(39,174,96,0.4);
  }
  .mini-card-cell.free {
    background:#f1c40f; color:#fff; border-color:#f39c12;
  }
  .board-card {
    background:#fff; border-radius:14px; padding:8px;
    margin-bottom:8px; box-shadow:0 2px 8px rgba(0,0,0,0.06);
    border:1px solid #e0c4e8;
  }
  .board-title {
    font-size:12px; font-weight:bold; color:#8e44ad;
    text-align:center; margin-bottom:6px;
  }
  .board-scroll {
    max-height:220px; overflow-y:auto;
    border-radius:8px; padding:4px;
    background:#faf5fc;
  }
  .board-scroll::-webkit-scrollbar { width:4px; }
  .board-scroll::-webkit-scrollbar-thumb { background:#c39bd3; border-radius:2px; }
  .num-grid {
    display:grid; grid-template-columns:repeat(8,1fr); gap:3px;
  }
  .num-cell {
    aspect-ratio:1; background:#f0e6f6; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:bold; color:#555;
    border:1px solid #e0c4e8; transition:all 0.3s;
  }
  .num-cell.called {
    background:#f39c12; color:#fff;
    box-shadow:0 2px 6px rgba(243,156,18,0.4);
  }
  .cards-scroll {
    max-height:180px; overflow-y:auto;
    padding:4px; background:#faf5fc; border-radius:8px;
  }
  .cards-scroll::-webkit-scrollbar { width:4px; }
  .cards-scroll::-webkit-scrollbar-thumb { background:#c39bd3; border-radius:2px; }
  .card-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .card-btn {
    aspect-ratio:1; background:linear-gradient(135deg,#27ae60,#1e8449);
    border:none; border-radius:8px; color:#fff;
    font-size:12px; font-weight:bold; cursor:pointer;
    box-shadow:0 2px 0 #145a32; transition:all 0.15s;
  }
  .card-btn:active { transform:translateY(2px); box-shadow:none; }
  .card-btn.taken {
    background:#ccc; color:#888; box-shadow:none; cursor:not-allowed;
  }
  .full-card-grid {
    display:grid; grid-template-columns:repeat(5,1fr); gap:5px;
  }
  .full-card-cell {
    aspect-ratio:1; background:#fff; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:bold; color:#333;
    border:2px solid #e0c4e8;
  }
  .full-card-cell.called { 
    background:#27ae60; color:#fff; border-color:#1e8449;
    box-shadow:0 2px 8px rgba(39,174,96,0.5);
  }
  .full-card-cell.free { background:#f1c40f; color:#fff; border-color:#f39c12; }
  .btn {
    width:100%; padding:14px; border:none; border-radius:12px;
    font-size:16px; font-weight:bold; cursor:pointer;
    transition:all 0.15s; margin-top:8px;
  }
  .btn-bingo {
    background:linear-gradient(135deg,#f39c12,#e67e22);
    color:#fff; box-shadow:0 4px 0 #b9770e;
  }
  .btn-bingo:active { transform:translateY(4px); box-shadow:none; }
  .admin-panel {
    background:linear-gradient(135deg,#2c3e50,#1a252f);
    color:#ecf0f1; border-radius:14px; padding:10px;
    margin-top:10px; border:2px solid #e74c3c;
  }
  .admin-panel .title {
    text-align:center; font-weight:bold;
    color:#f39c12; margin-bottom:8px; font-size:13px;
  }
  .admin-btn {
    background:linear-gradient(135deg,#34495e,#2c3e50);
    color:#ecf0f1; border:1px solid #4a6580;
    border-radius:8px; padding:8px; margin:3px 0;
    font-size:11px; cursor:pointer; width:100%;
  }
  .admin-btn:active { background:#1a252f; }
  .admin-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:4px;
  }
  .hidden { display:none !important; }
  .loading { text-align:center; padding:40px; color:#8e44ad; font-size:14px; }
  .winner-section {
    background:linear-gradient(135deg,#f39c12,#e67e22,#f39c12);
    background-size:200% 200%;
    animation:winnerGlow 2s ease-in-out infinite;
    color:#fff; padding:20px; border-radius:18px;
    text-align:center; margin:10px 0;
    box-shadow:0 8px 25px rgba(243,156,18,0.6);
    border:3px solid #fff;
  }
  @keyframes winnerGlow {
    0%,100% { background-position:0% 50%; transform:scale(1); }
    50% { background-position:100% 50%; transform:scale(1.02); }
  }
  .winner-section .crown { font-size:48px; margin-bottom:8px; }
  .winner-section .congrats {
    font-size:22px; font-weight:bold;
    text-shadow:2px 2px 4px rgba(0,0,0,0.3);
    margin-bottom:12px;
  }
  .winner-section .winner-name {
    background:rgba(255,255,255,0.25);
    padding:8px 16px; border-radius:20px;
    font-size:18px; font-weight:bold;
    display:inline-block; margin-bottom:8px;
  }
  .winner-section .card-info {
    font-size:14px; opacity:0.95;
    margin-top:8px;
  }
  .winner-section .card-number {
    background:rgba(255,255,255,0.3);
    padding:4px 12px; border-radius:12px;
    font-size:16px; font-weight:bold;
    display:inline-block; margin-top:4px;
  }
  .winner-section .trophy {
    font-size:32px; margin-top:8px;
    animation:bounce 1s infinite;
  }
  @keyframes bounce {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-10px); }
  }
  .winner-section .info-line {
    font-size:12px; opacity:0.9;
    margin-top:10px; padding-top:10px;
    border-top:1px dashed rgba(255,255,255,0.5);
  }
  .toast {
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.85); color:#fff;
    padding:10px 20px; border-radius:20px;
    font-size:12px; z-index:9999;
    animation:toastIn 0.3s ease-out;
  }
  @keyframes toastIn {
    from { opacity:0; transform:translate(-50%,20px); }
    to { opacity:1; transform:translate(-50%,0); }
  }
  .confetti-container {
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:9998; overflow:hidden;
  }
  .confetti {
    position:absolute; width:10px; height:10px;
    animation:confettiFall 3s linear infinite;
  }
  @keyframes confettiFall {
    0% { transform:translateY(-100vh) rotate(0deg); opacity:1; }
    100% { transform:translateY(100vh) rotate(720deg); opacity:0; }
  }
</style>
</head>
<body>

<div class="confetti-container" id="confetti-container"></div>

<div class="header">
  <h1 id="game-title">🎰 ዘና ቢንጎ ከድጎ</h1>
  <p id="room-label">ክፍል በመጫን ላይ...</p>
</div>

<div id="loading" class="loading">⏳ በመጫን ላይ...</div>

<div id="main" class="hidden">

  <div class="stats-bar">
    <div class="stat-box live">
      <div class="label">👥 Live</div>
      <div class="value" id="s-live">0</div>
    </div>
    <div class="stat-box">
      <div class="label">🎯 የተጠሩ</div>
      <div class="value" id="s-called">0</div>
    </div>
    <div class="stat-box">
      <div class="label">🎫 ካርዶች</div>
      <div class="value" id="s-cards">0</div>
    </div>
    <div class="stat-box">
      <div class="label">💰 ዋጋ</div>
      <div class="value" id="s-price">0</div>
    </div>
  </div>

  <div id="timer-banner" class="timer-banner hidden">
    ⏱️ የመግቢያ ጊዜ: <span id="timer-text">0</span> ሰከንድ
  </div>

  <div id="winner-section" class="winner-section hidden">
    <div class="crown">👑</div>
    <div class="congrats">🎊 እንኳን ደስ ያለህ/ሽ! 🎊</div>
    <div class="winner-name" id="winner-name">👤</div>
    <div class="card-info">
      🎫 ያሸነፈበት ካርድ:
      <div class="card-number" id="winner-card">#?</div>
    </div>
    <div class="info-line">
      <span id="winner-stats">🎯 ጠቅላላ የተጠሩ: -</span>
    </div>
    <div class="trophy">🏆</div>
  </div>

  <div class="top-row">
    <div class="called-box">
      <div class="label">🎯 የተጠራ</div>
      <div class="value" id="called-num-display">-</div>
    </div>
    <div class="mycard-box">
      <div class="title">🎲 የእኔ ካርዴ <span id="card-num-label"></span></div>
      <div class="bingo-header">
        <div class="b-red">B</div>
        <div class="b-green">I</div>
        <div class="b-yellow">N</div>
        <div class="b-blue">G</div>
        <div class="b-purple">O</div>
      </div>
      <div class="mini-card-grid" id="my-mini-card"></div>
    </div>
  </div>

  <div class="board-card">
    <div class="board-title">📺 የጨዋታ ሰሌዳ (1-90)</div>
    <div class="board-scroll">
      <div class="num-grid" id="master-board"></div>
    </div>
  </div>

  <div id="join-section">
    <div class="board-card">
      <div class="board-title">🎫 ካርድ ምረጥ</div>
      <div class="cards-scroll">
        <div class="card-grid" id="card-selector"></div>
      </div>
    </div>
  </div>

  <div id="card-section" class="hidden">
    <div class="board-card">
      <div class="board-title">🎲 የእኔ ካርድ <span id="full-card-num-label"></span></div>
      <div class="bingo-header">
        <div class="b-red">B</div>
        <div class="b-green">I</div>
        <div class="b-yellow">N</div>
        <div class="b-blue">G</div>
        <div class="b-purple">O</div>
      </div>
      <div class="full-card-grid" id="my-full-card"></div>
    </div>
    <button class="btn btn-bingo" id="bingo-btn">🎉 BINGO!</button>
  </div>

  <div id="admin-panel" class="admin-panel hidden">
    <div class="title">🔐 የአስተዳዳሪ ምስጢራዊ ፓነል</div>
    <div class="admin-grid">
      <button class="admin-btn" onclick="adminCallNumber()">🎯 ቁጥር ጥራ</button>
      <button class="admin-btn" onclick="adminTogglePause()">⏸️ አቁም/ቀጥል</button>
      <button class="admin-btn" onclick="adminViewAllCards()">🎴 ሁሉንም ካርዶች</button>
      <button class="admin-btn" onclick="adminForceWin()">🏆 አሸናፊ ምረጥ</button>
      <button class="admin-btn" onclick="adminSetName()">✏️ ስም ቀይር</button>
      <button class="admin-btn" onclick="adminReset()">🔄 ጨዋታ አስጀምር</button>
    </div>
  </div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();
const USER_ID = tg.initDataUnsafe?.user?.id || 0;
const IS_ADMIN = USER_ID === 5671366303;
let ROOM_ID = 1;
let MY_CARD_NUM = null;
let HAS_SELECTED = false;
let LAST_CALLED = null;
let WINNER_SHOWN = false;

async function api(path, method='GET', body=null) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  try {
    const res = await fetch(path, opts);
    return await res.json();
  } catch(e) {
    return { error: 'network' };
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function launchConfetti() {
  const container = document.getElementById('confetti-container');
  const colors = ['#f39c12','#e74c3c','#27ae60','#3498db','#9b59b6','#f1c40f'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 2 + 's';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    container.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

function renderMasterBoard(called) {
  const board = document.getElementById('master-board');
  const calledSet = new Set(called);
  board.innerHTML = '';
  for (let i = 1; i <= 90; i++) {
    const cell = document.createElement('div');
    cell.className = 'num-cell';
    cell.innerText = i;
    if (calledSet.has(i)) cell.classList.add('called');
    board.appendChild(cell);
  }
}

function renderMiniCard(card) {
  const el = document.getElementById('my-mini-card');
  el.innerHTML = '';
  card.forEach(row => {
    row.forEach(cell => {
      const d = document.createElement('div');
      d.className = 'mini-card-cell';
      const s = String(cell);
      if (s === '⭐') { d.classList.add('free'); d.innerText = '⭐'; }
      else if (s.startsWith('✅')) { d.classList.add('called'); d.innerText = s.replace('✅',''); }
      else { d.innerText = s; }
      el.appendChild(d);
    });
  });
}

function renderFullCard(card) {
  const el = document.getElementById('my-full-card');
  el.innerHTML = '';
  card.forEach(row => {
    row.forEach(cell => {
      const d = document.createElement('div');
      d.className = 'full-card-cell';
      const s = String(cell);
      if (s === '⭐') { d.classList.add('free'); d.innerText = '⭐'; }
      else if (s.startsWith('✅')) { d.classList.add('called'); d.innerText = s.replace('✅',''); }
      else { d.innerText = s; }
      el.appendChild(d);
    });
  });
}

function renderCardSelector(taken, total) {
  const sel = document.getElementById('card-selector');
  sel.innerHTML = '';
  const limit = Math.min(total || 200, 200);
  for (let i = 1; i <= limit; i++) {
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    btn.innerText = i;
    if (taken.includes(i-1)) btn.classList.add('taken');
    btn.onclick = () => selectCard(i);
    sel.appendChild(btn);
  }
}

async function selectCard(num) {
  const res = await api('/api/join', 'POST', { user_id: USER_ID, room_id: ROOM_ID, card_num: num });
  if (!res.ok) { tg.showAlert(res.msg); return; }
  MY_CARD_NUM = num;
  HAS_SELECTED = true;
  tg.showAlert(`✅ ካርድ ${num} ተመርጧል!\n💰 ${res.payment.price}\n🏦 ${res.payment.account}\n\nክፍያ ከፍለህ ስክሪንሾት ወደ ቦቱ ላክ።`);
  document.getElementById('join-section').classList.add('hidden');
  document.getElementById('card-section').classList.remove('hidden');
  document.getElementById('full-card-num-label').innerText = `#${num}`;
  document.getElementById('card-num-label').innerText = `#${num}`;
}

function showWinnerBanner(data) {
  if (WINNER_SHOWN) return;
  WINNER_SHOWN = true;
  document.getElementById('winner-section').classList.remove('hidden');
  document.getElementById('winner-name').innerText = `👤 ${data.winner || 'ተጫዋች'}`;
  document.getElementById('winner-card').innerText = `#${data.winner_card || '?'}`;
  document.getElementById('winner-stats').innerText = `🎯 ጠቅላላ የተጠሩ: ${data.called_count || 0}`;
  launchConfetti();
}

async function loadRoom() {
  const params = new URLSearchParams(window.location.search);
  ROOM_ID = parseInt(params.get('room') || 1);
  const data = await api(`/api/room/${ROOM_ID}`);
  if (data.error) {
    document.getElementById('loading').innerText = '⚠️ ክፍል አልተገኘም';
    return;
  }
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  
  if (data.game_name) document.getElementById('game-title').innerText = `🎰 ${data.game_name}`;
  document.getElementById('room-label').innerText = `ክፍል ${ROOM_ID} • ${data.game_state}`;
  
  document.getElementById('s-live').innerText = data.players;
  document.getElementById('s-called').innerText = data.called_count;
  document.getElementById('s-cards').innerText = `${data.taken_cards.length}/${data.total_cards}`;
  document.getElementById('s-price').innerText = data.price;

  const timerBanner = document.getElementById('timer-banner');
  if (data.join_open && data.time_left > 0) {
    timerBanner.classList.remove('hidden');
    timerBanner.classList.toggle('safe', data.time_left > 30);
    document.getElementById('timer-text').innerText = data.time_left;
  } else {
    timerBanner.classList.add('hidden');
  }

  const calledDisplay = document.getElementById('called-num-display');
  if (data.last_called) {
    calledDisplay.innerText = data.last_called;
    if (LAST_CALLED !== data.last_called) {
      LAST_CALLED = data.last_called;
      calledDisplay.style.animation = 'none';
      setTimeout(() => calledDisplay.style.animation = 'pulse 0.5s', 10);
    }
  }

  renderMasterBoard(data.called);

  if (!HAS_SELECTED && data.join_open && data.game_state === 'joining') {
    renderCardSelector(data.taken_cards, data.total_cards);
    document.getElementById('join-section').classList.remove('hidden');
  } else {
    document.getElementById('join-section').classList.add('hidden');
  }

  if (data.winners && data.winners.length > 0 && data.winner_name) {
    showWinnerBanner({
      winner: data.winner_name,
      winner_card: data.winner_card,
      called_count: data.called_count
    });
  }
  return data;
}

async function updateMyCard() {
  const res = await api('/api/mycard', 'POST', { user_id: USER_ID, room_id: ROOM_ID });
  if (res.card) {
    MY_CARD_NUM = res.card_num;
    HAS_SELECTED = true;
    renderMiniCard(res.card);
    renderFullCard(res.card);
    document.getElementById('card-section').classList.remove('hidden');
    document.getElementById('full-card-num-label').innerText = `#${res.card_num}`;
    document.getElementById('card-num-label').innerText = `#${res.card_num}`;
  }
}

document.getElementById('bingo-btn').onclick = async () => {
  const res = await api('/api/bingo', 'POST', { user_id: USER_ID, room_id: ROOM_ID });
  if (res.ok) {
    tg.showAlert(`🎉 BINGO! አሸንፈሃል! (ካርድ ${res.card_num})`);
    WINNER_SHOWN = false;
    loadRoom();
  } else {
    tg.showAlert(res.msg);
  }
};

async function adminCallNumber() {
  const num = prompt('የሚጠራውን ቁጥር አስገባ (1-90):');
  if (!num) return;
  const n = parseInt(num);
  if (isNaN(n) || n < 1 || n > 90) { tg.showAlert('ቁጥሩ 1-90 መሆን አለበት'); return; }
  const res = await api('/api/admin/call_number', 'POST', { user_id: USER_ID, room_id: ROOM_ID, number: n });
  if (res.ok) { showToast(`✅ ቁጥር ${n} ተጠርቷል`); loadRoom(); }
  else { tg.showAlert(res.msg || 'ስህተት'); }
}

async function adminTogglePause() {
  const res = await api('/api/admin/toggle_pause', 'POST', { user_id: USER_ID, room_id: ROOM_ID });
  if (res.paused !== undefined) { showToast(res.paused ? '⏸️ ቆሟል' : '▶️ ቀጥሏል'); }
}

async function adminViewAllCards() {
  const res = await api('/api/admin/allcards', 'POST', { user_id: USER_ID, room_id: ROOM_ID });
  if (!res.players) { tg.showAlert('ስህተት'); return; }
  let msg = `🎴 ሁሉም ካርዶች (${res.players.length}):\n\n`;
  res.players.forEach(p => {
    msg += `👤 ${p.name}\n🎫 ካርድ #${p.card_num}\n${p.approved ? '✅' : '⏳'}\n---\n`;
  });
  tg.showAlert(msg);
}

async function adminForceWin() {
  const targetId = prompt('የአሸናፊውን User ID አስገባ:');
  if (!targetId) return;
  const res = await api('/api/admin/force_win', 'POST', { user_id: USER_ID, room_id: ROOM_ID, target_user_id: parseInt(targetId) });
  if (res.ok) { showToast('🏆 አሸናፊ ተመርጧል'); WINNER_SHOWN = false; loadRoom(); }
}

async function adminSetName() {
  const name = prompt('አዲስ የጨዋታ ስም:', 'ዘና ቢንጎ ከድጎ');
  if (!name) return;
  const res = await api('/api/admin/set_name', 'POST', { user_id: USER_ID, room_id: ROOM_ID, name: name });
  if (res.ok) { showToast('✅ ስም ተቀይሯል'); loadRoom(); }
}

async function adminReset() {
  if (!confirm('ጨዋታውን ሙሉ በሙሉ ማስጀመር ትፈልጋለህ?')) return;
  const res = await api('/api/admin/reset', 'POST', { user_id: USER_ID, room_id: ROOM_ID });
  if (res.ok) { showToast('🔄 ተስተካክሏል'); setTimeout(() => location.reload(), 1000); }
}

async function poll() {
  await loadRoom();
  await updateMyCard();
}

if (IS_ADMIN) {
  document.getElementById('admin-panel').classList.remove('hidden');
}

setInterval(poll, 3000);
loadRoom();
</script>
</body>
</html>
