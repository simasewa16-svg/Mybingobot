<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ሃ ቡንላ ከድራ!</title>
    <style>
        /* እዚህ ላይ የCSS ኮዱን እናስገባለን */
    </style>
</head>
<body>
    <div class="app-container">
        <!-- የላይኛው መረጃ አሞሌ (Stats) -->
        <div class="top-stats">
            <div class="stat-box"><span>Players</span><br><b id="players-count">0</b></div>
            <div class="stat-box"><span>Derash</span><br><b id="derash-amount">0</b></div>
            <div class="stat-box"><span>Bet</span><br><b id="bet-amount">10</b></div>
            <div class="stat-box"><span>Call Count</span><br><b id="call-count">0</b></div>
        </div>

        <!-- ዋናው የጨዋታ አካባቢ -->
        <div class="game-area">
            <!-- የግራ በኩል፦ የቢንጎ ካርድ -->
            <div class="bingo-card">
                <div class="card-headers">
                    <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
                </div>
                <div class="card-grid" id="bingo-grid">
                    <!-- ቁጥሮቹ በJavaScript ይሞላሉ -->
                    <div class="cell">1</div> <div class="cell">16</div> <div class="cell">31</div> <div class="cell">46</div> <div class="cell">61</div>
                    <!-- ... 25 ሳጥኖች ድረስ ... -->
                </div>
            </div>

            <!-- የቀኝ በኩል፦ የጥሪ አካባቢ -->
            <div class="call-area">
                <div class="current-call-box">
                    <span>Current Call</span>
                    <div class="big-circle" id="current-call">-</div>
                </div>
                
                <div class="recent-calls" id="recent-calls">
                    <!-- የቅርብ ጥሪዎች እዚህ ይታያሉ -->
                </div>

                <div class="auto-toggle">
                    <span>Auto</span>
                    <label class="switch">
                        <input type="checkbox" id="auto-play">
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="message-box" id="status-message">
                    Dear STB, Please wait for this game to be completed
                </div>
            </div>
        </div>
    </div>
</body>
</html>
