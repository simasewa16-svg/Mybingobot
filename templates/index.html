<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ሃ ቡንላ ከድራ!</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ================= CSS ክፍል ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f3e5f5; padding: 10px; color: #333; }
        .app-container { max-width: 800px; margin: auto; display: flex; flex-direction: column; gap: 10px; }

        /* የላይኛው የጨዋታ ስም እና ባላንስ */
        .top-header { background: linear-gradient(135deg, #6a1b9a, #ab47bc); color: white; padding: 15px; border-radius: 10px; text-align: center; }
        .top-header h1 { font-size: 18px; margin-bottom: 5px; }
        .balance-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 8px; }
        .btn-deposit { background: #4caf50; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        /* የጨዋታ መረጃ ሳጥኖች */
        .stats-grid { display: flex; justify-content: space-between; background: #fff; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stat-box { text-align: center; font-size: 12px; color: #666; flex: 1; }
        .stat-box b { display: block; font-size: 16px; color: #000; margin-top: 3px; }

        /* ዋናው የጨዋታ አካባቢ (ጎን ለጎን) */
        .game-area { display: flex; flex-direction: row; gap: 10px; }
        @media (max-width: 600px) { .game-area { flex-direction: column; } }

        /* የግራ በኩል፦ የቢንጎ ካርድ */
        .bingo-card { flex: 1; background: #fff; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card-headers { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-weight: bold; font-size: 20px; margin-bottom: 5px; }
        .card-headers div:nth-child(1) { color: #2e7d32; } .card-headers div:nth-child(2) { color: #f57c00; }
        .card-headers div:nth-child(3) { color: #1976d2; } .card-headers div:nth-child(4) { color: #d32f2f; }
        .card-headers div:nth-child(5) { color: #7b1fa2; }
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .cell { background: #e0e0e0; text-align: center; padding: 12px 0; border-radius: 5px; font-weight: bold; color: #333; cursor: pointer; user-select: none; }
        .cell.marked { background: #ff9800; color: white; }
        .cell.winning { background: #4caf50; color: white; }

        /* የቀኝ በኩል፦ የጥሪ አካባቢ */
        .call-area { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .current-call-box { background: #6a1b9a; color: white; padding: 15px; border-radius: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .current-call-box span { font-size: 14px; margin-bottom: 5px; }
        .big-circle { background: #ff9800; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        
        .recent-calls { display: flex; justify-content: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
        .recent-calls .small-circle { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: white; }
        .bg-orange { background: #ff9800; } .bg-green { background: #4caf50; } .bg-red { background: #f44336; } .bg-blue { background: #2196f3; }

        .auto-toggle { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px; border-radius: 10px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2196f3; }
        input:checked + .slider:before { transform: translateX(20px); }

        .message-box { background: #f3e5f5; border: 2px solid #ce93d8; padding: 20px; border-radius: 10px; text-align: center; color: #6a1b9a; font-weight: bold; font-size: 14px; flex: 1; display: flex; align-items: center; justify-content: center; }

        /* የታችኛው ቁልፎች */
        .bottom-nav { display: flex; gap: 10px; margin-top: 10px; }
        .nav-btn { flex: 1; background: #7b1fa2; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }

        /* ሞዳል (Modal) ማሳያ */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 15px; text-align: center; }
        .modal-box h2 { color: #6a1b9a; margin-bottom: 15px; font-size: 18px; }
        .payment-options { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
        .pay-btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; }
        .pay-telebirr { background: #4caf50; }
        .pay-cbe { background: #800080; }
        .account-number { font-size: 20px; font-weight: bold; color: #d32f2f; margin: 10px 0; letter-spacing: 1px; }
        .close-btn { background: #ccc; color: #333; border: none; padding: 10px 20px; border-radius: 5px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- የላይኛው አሞሌ -->
        <div class="top-header">
            <h1>🎰 ሃ ቡንላ ከድራ!</h1>
            <div class="balance-bar">
                <span>💰 ባላንስ: <b id="user-balance">0 ብር</b></span>
                <button class="btn-deposit" onclick="openDepositModal()">+ ጨምር</button>
            </div>
        </div>

        <!-- የጨዋታ መረጃዎች -->
        <div class="stats-grid">
            <div class="stat-box">👥 Players<b id="players-count">5</b></div>
            <div class="stat-box">🎯 Derash<b id="derash-amount">50</b></div>
            <div class="stat-box">💵 Bet<b id="bet-amount">10 ብር</b></div>
            <div class="stat-box">📢 Call Count<b id="call-count">4</b></div>
        </div>

        <!-- ዋናው የጨዋታ አካባቢ -->
        <div class="game-area">
            <!-- የግራ በኩል፦ የቢንጎ ካርድ -->
            <div class="bingo-card">
                <div class="card-headers">
                    <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
                </div>
                <div class="card-grid" id="bingo-grid"></div>
            </div>

            <!-- የቀኝ በኩል፦ የጥሪ አካባቢ -->
            <div class="call-area">
                <div class="current-call-box">
                    <span>Current Call</span>
                    <div class="big-circle" id="current-call">16</div>
                </div>
                
                <div class="recent-calls" id="recent-calls"></div>

                <div class="auto-toggle">
                    <span>Auto</span>
                    <label class="switch">
                        <input type="checkbox" id="auto-play">
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="message-box" id="status-message">
                    ውድ ተጫዋች! እባክህ/ሽ ይህ ጨዋታ እስኪጠናቀቅ በትዕግስት ጠብቅ/ቂ።
                </div>
            </div>
        </div>

        <!-- የታችኛው ቁልፎች -->
        <div class="bottom-nav">
            <button class="nav-btn">🎫 ካርድ</button>
            <button class="nav-btn">🏆 ሰንጠረዥ</button>
            <button class="nav-btn">📜 ታሪክ</button>
        </div>
    </div>

    <!-- የክፍያ ማስገቢያ ሞዳል (Modal) -->
    <div class="modal-overlay" id="depositModal">
        <div class="modal-box">
            <h2>💳 ባላንስ ለመሙላት</h2>
            <p>እባክህ/ሽ ከታች ያለውን የአካውንት ቁጥር በመጠቀም ገንዘብ ያስተላልፉ።</p>
            
            <div class="account-number">0912649315</div>
            
            <div class="payment-options">
                <button class="pay-btn pay-telebirr" onclick="selectPayment('ቴሌብር')">📱 ቴሌብር (Telebirr)</button>
                <button class="pay-btn pay-cbe" onclick="selectPayment('ሲቢኢ ብር')">🏦 ሲቢኢ ብር (CBE Birr)</button>
            </div>

            <p style="font-size: 12px; color: #666;">ከተላለፉ በኋላ የደረሰኙን ሊንክ ወይም የትራንዛክሽን ቁጥር ለአስተዳዳሪው ይላኩ።</p>
            <button class="close-btn" onclick="closeDepositModal()">ዝጋ</button>
        </div>
    </div>

    <script>
        /* ================= JavaScript ክፍል ================= */
        
        // የቴሌግራም አፕ ማስጀመሪያ
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ⚠️ በኋላ ላይ በRender ላይ የሚሰጠውን ሊንክ እዚህ እናስገባለን
        const API_BASE_URL = "https://mybingobot-1.onrender.com"; 

        // የተጠቃሚውን መታወቂያ ማግኘት
        const telegramUser = tg.initDataUnsafe?.user;
        const userId = telegramUser ? telegramUser.id.toString() : "123456789"; // ለሙከራ የተቀመጠ ቁጥር

        let currentGameId = 1; // የጨዋታው መታወቂያ (ለሙከራ)
        let cardPrice = 10; // የአንድ ካርድ ዋጋ 10 ብር

        // 1. የተጠቃሚ መረጃ ከBackend ማምጣት
        async function fetchUserInfo() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/user/${userId}`);
                const data = await response.json();
                document.getElementById('user-balance').innerText = data.balance + " ብር";
            } catch (error) {
                console.error("የተጠቃሚ መረጃ ማምጣት አልተቻለም:", error);
            }
        }

        // 2. የጨዋታ ሁኔታን ከBackend ማምጣት
        async function fetchGameState() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/game/${currentGameId}`);
                const data = await response.json();
                
                document.getElementById('derash-amount').innerText = data.jackpot;
                document.getElementById('call-count').innerText = data.call_count;
                document.getElementById('bet-amount').innerText = cardPrice + ' ብር';
                
                // የጃክፖቱ መጠን ከ10 ብር በታች ከሆነ ቢያንስ 10 እናድርገው
                if(data.jackpot < 10) {
                    document.getElementById('derash-amount').innerText = 10;
                }
            } catch (error) {
                console.error("የጨዋታ ሁኔታ ማምጣት አልተቻለም:", error);
            }
        }

        // 3. የቢንጎ ካርድ ቁጥሮችን ማመንጨት (ለሙከራ)
        function generateBingoCard() {
            const grid = document.getElementById('bingo-grid');
            grid.innerHTML = '';
            
            const columns = [
                [1, 15], [16, 30], [31, 45], [46, 60], [61, 75]
            ];
            
            let cardNumbers = [];
            for (let i = 0; i < 5; i++) {
                let colNums = [];
                while(colNums.length < 5) {
                    let num = Math.floor(Math.random() * (columns[i][1] - columns[i][0] + 1)) + columns[i][0];
                    if(!colNums.includes(num)) colNums.push(num);
                }
                cardNumbers.push(colNums);
            }

            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    if(row === 2 && col === 2) {
                        cell.innerText = 'FREE';
                        cell.classList.add('marked');
                    } else {
                        cell.innerText = cardNumbers[col][row];
                    }
                    cell.onclick = function() { this.classList.toggle('marked'); };
                    grid.appendChild(cell);
                }
            }
        }

        // 4. የክፍያ ሞዳል መክፈት እና መዝጋት
        function openDepositModal() { document.getElementById('depositModal').style.display = 'flex'; }
        function closeDepositModal() { document.getElementById('depositModal').style.display = 'none'; }

        // 5. የክፍያ ጥያቄ ወደ Backend መላክ
        async function selectPayment(method) {
            const amount = prompt("እባክህ/ሽ ያስተላለፍከው/ሽውን ገንዘብ መጠን አስገባ (በብር):");
            if (!amount) return;

            const reference = prompt("እባክህ/ሽ የደረሰኙን ቁጥር (Transaction ID) አስገባ:");
            if (!reference) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        amount: parseFloat(amount),
                        method: method,
                        reference: reference
                    })
                });
                
                const data = await response.json();
                if(response.ok) {
                    alert("የክፍያ ጥያቄዎ ተልኳል! አስተዳዳሪው ሲያረጋግጥ ባላንስዎ ይሞላል።");
                } else {
                    alert("ስህተት: " + data.detail);
                }
            } catch (error) {
                alert("ከኢንተርኔት ጋር መገናኘት አልተቻለም።");
            }
            closeDepositModal();
        }

        // 6. ካርድ መግዛት
        async function buyCard() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/buy_card`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: currentGameId
                    })
                });
                
                const data = await response.json();
                if(response.ok) {
                    alert("ካርድ በተሳካ ሁኔታ ገዝተዋል! 🎉");
                    fetchUserInfo(); // ባላንስ አድስ
                } else {
                    alert("ስህተት: " + data.detail);
                }
            } catch (error) {
                alert("ከኢንተርኔት ጋር መገናኘት አልተቻለም።");
            }
        }

        // 7. መነሻ ተግባራት (Initialize)
        window.onload = function() {
            generateBingoCard();
            fetchUserInfo();
            fetchGameState();
            
            // በየ 5 ሰከንዱ የጨዋታ ሁኔታን አድስ
            setInterval(fetchGameState, 5000);
        };
    </script>
</body>
</html>
