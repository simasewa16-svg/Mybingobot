# =====================================================================
# ✅ Alembic Configuration (alembic.ini) - v8.1
# =====================================================================
# ⚠️ DATABASE_URL እዚህ አይጻፍ! — ከEnvironment Variable ይመጣል
# env.py ውስጥ database.py ን import ያደርጋል
# =====================================================================

[alembic]
# ✅ Migration ፋይሎች የሚቀመጡበት ቦታ
script_location = alembic

# ✅ የፋይል ስም ቅርጸት (timestamp prefix)
file_template = %%(rev)s_%%(slug)s

# ✅ Timezone (UTC)
timezone = UTC

# ⚠️ sqlalchemy.url ወደ env.py ይሄዳል (Environment Variable ከሆነ)
# ይህ ባዶ መሆኑ ይመረጣል
sqlalchemy.url =


# =====================================================================
# ✅ Logging Configuration
# =====================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
